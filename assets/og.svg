<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .ttl { font-family: "Hiragino Mincho ProN","Yu Mincho",serif; fill: #2b2b2b; font-weight: 700; }
      .sans { font-family: "Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="14" height="630" fill="#0b8bee"/>

  <!-- decorative network motif (right) -->
  <g transform="translate(905,315)" opacity="0.9">
    <g stroke="#9dd1f8" stroke-width="3">
      <line x1="0" y1="0" x2="-120" y2="-95"/>
      <line x1="0" y1="0" x2="130" y2="-70"/>
      <line x1="0" y1="0" x2="-95" y2="110"/>
      <line x1="0" y1="0" x2="115" y2="105"/>
      <line x1="-120" y1="-95" x2="130" y2="-70"/>
      <line x1="-95" y1="110" x2="115" y2="105"/>
    </g>
    <g fill="#0b8bee">
      <circle cx="0" cy="0" r="34"/>
      <circle cx="-120" cy="-95" r="17"/>
      <circle cx="130" cy="-70" r="20"/>
      <circle cx="-95" cy="110" r="15"/>
      <circle cx="115" cy="105" r="18"/>
    </g>
    <g fill="#6db9f5">
      <circle cx="170" cy="40" r="11"/>
      <circle cx="-150" cy="10" r="10"/>
    </g>
  </g>

  <!-- text block (left) -->
  <text class="sans" x="80" y="150" font-size="30" fill="#0b8bee" font-weight="700" letter-spacing="2">DH ／ TEI 二次利用例</text>
  <text class="ttl" x="78" y="250" font-size="76">抽斎年譜 TEI</text>
  <text class="ttl" x="78" y="340" font-size="76">ビジュアライザ</text>
  <text class="sans" x="80" y="410" font-size="29" fill="#444">若手図書館員DH勉強会『抽斎年譜』TEI/XML を可視化</text>
  <text class="sans" x="80" y="458" font-size="26" fill="#6a6a6a">人物ネットワーク ／ 登場タイムライン ／ 年譜⇔渋江抽斎 対訳</text>
  <text class="sans" x="80" y="556" font-size="27" fill="#0b8bee" font-weight="700">nakamura196.github.io/tei-chusai-viz</text>
</svg>
